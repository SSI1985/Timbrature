<style>

  .chip-blu { background: var(--blue-tint); color: var(--blue-dark); }
  .chip-arancio { background: var(--orange-tint); color: var(--orange-dark); }
  .chip-verde { background: #E3F4EA; color: #146C3A; }
  .chip-rosso { background: #FDE8E7; color: #B42318; }
  .avviso { display: flex; gap: 10px; align-items: flex-start; border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.4; }
  .avviso-blu { background: var(--blue-tint); color: var(--blue-dark); }
  .avviso-arancio { background: var(--orange-tint); color: var(--orange-dark); }

  .btn-nero { background: var(--ink); color: #fff; }

  .btn-testo { background: transparent; color: var(--blue); height: 44px; font-size: 15px; }
  .btn:disabled { opacity: .55; cursor: default; }

  .campo label, .campo .lbl { font-size: 14px; font-weight: 600; }

  textarea.input { height: auto; padding: 12px 14px; resize: none; }
  .input-codice { height: 60px; font-size: 26px; letter-spacing: .35em; text-align: center; }
  .scelte { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .pillole { display: flex; flex-wrap: wrap; gap: 8px; }

  .pillola { border-radius: 999px; min-height: 44px; }
  .scelta[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .scelta[disabled] { opacity: .4; border-style: dashed; }
  .celle { display: grid; gap: 8px; }
  .cella { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .cella span:first-child { font-size: 13px; color: var(--muted); font-weight: 500; }
  .cella .orario { font-family: 'Space Grotesk', Inter, sans-serif; font-weight: 600; font-variant-numeric: tabular-nums; }
  .centro { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 8px 0; }

  .stato-ko { background: var(--orange-tint); color: var(--orange); }

  .st-ok .cerchio, .st-run .cerchio { background: var(--blue-tint); color: var(--blue); }
  .st-wait .cerchio { background: var(--grey-tint); color: #AEB4BD; }

  .controllo small { display: block; font-size: 15px; color: var(--muted); }
  .grande { font-family: 'Space Grotesk', Inter, sans-serif; font-size: 60px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .settimana div { display: flex; justify-content: space-between; align-items: center; min-height: 28px; font-size: 15px; }
  .settimana span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; }
  .elenco { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.45; color: var(--soft); }
  .elenco li + li { margin-top: 4px; }
  .numero { width: 26px; height: 26px; flex: none; border-radius: 50%; background: var(--ink); color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .mirino { flex: 1; min-height: 260px; border-radius: 20px; background: #22262C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #C9CDD3; font-size: 14px; }
  .mirino div { width: 150px; height: 195px; border: 3px dashed #AEB4BD; border-radius: 50%; }
  .spinner { animation: ruota .9s linear infinite; }
  .pulsa { animation: pulsa 1.4s ease-in-out infinite; }
  @keyframes ruota { to { transform: rotate(360deg); } }
  @keyframes pulsa { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
  .spazio { flex: 1; }
  .errore { color: var(--orange-dark); font-size: 14px; font-weight: 600; }
  .piede { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; font-size: 14px; color: var(--muted); }
  .piede a { color: var(--blue); }
  .mesi { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .mesi .titolo-mese { font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 600; text-transform: capitalize; text-align: center; flex: 1; }
  .freccia { width: 44px; height: 44px; border-radius: 12px; border: 1px solid #C9CDD3; background: #fff; color: var(--ink); display: flex; align-items: center; justify-content: center; flex: none; }
  .freccia:disabled { opacity: .35; cursor: default; }
  .totali { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .totali div { display: flex; flex-direction: column; gap: 2px; }
  .totali b { font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 600; }
  .giorno { display: flex; flex-direction: column; gap: 8px; }
  .giorno .orari { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; font-size: 14px; }
  .giorno .orari span { color: var(--muted); }
  .giorno .orari strong { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .chip-grigio { background: var(--grey-tint); color: var(--soft); }
  .segn { display: flex; flex-direction: column; gap: 4px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .segn-apri { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding: 4px 0; min-height: 36px; font: inherit; color: inherit; cursor: pointer; }
  .pallino-rosso { background: #D92D20; color: #fff; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 4px 10px; }
  .segn-freccia { font-size: 22px; line-height: 1; color: var(--soft); transform: rotate(90deg); transition: transform .15s; }
  .segn-freccia.su { transform: rotate(-90deg); }
  .segn-testa { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .btn-secondario { background: #fff; color: var(--ink); border: 1px solid #C9CDD3; height: 48px; font-size: 15px; }
</style>

  function idTelefono() {
    var id = leggiMem('tm_tel');

  function codice() { return leggiMem('tm_cod'); }

  }
  function segreto() { return leggiMem('tm_disp'); }

    privacy: function () {

      var cosa = p.conservazione.map(function (x) {

      }).join('');
      var tipi = p.tipi.map(function (t) { return '<option' + (pv.tipo === t ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('');
      var mie = p.richieste.map(function (x) {

        return '<div style="display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line)">' +
          '<div class="riga" style="justify-content:space-between;gap:8px"><span style="font-size:14px;font-weight:600">' + esc(x.tipo) + ' · ' + esc(String(x.quando).slice(8, 10) + '/' + String(x.quando).slice(5, 7)) + '</span><span class="chip ' + colore + '">' + esc(x.stato) + '</span></div>' +
          (x.testo ? '<span class="muted" style="font-size:14px">«' + esc(x.testo) + '»</span>' : '') +

      }).join('');
      return testa +
        (pv.messaggio ? '<div class="avviso avviso-blu" role="status">' + esc(pv.messaggio) + '</div>' : '') +
        '<section class="card" aria-label="Cosa registriamo" style="display:flex;flex-direction:column;gap:0"><span class="etichetta" style="padding-bottom:6px">Cosa registriamo e per quanto</span>' + cosa +
          (p.accettata ? '<span class="muted" style="font-size:13px;padding-top:8px">Informativa accettata il ' + esc(p.accettata.slice(8, 10) + '/' + p.accettata.slice(5, 7) + '/' + p.accettata.slice(0, 4)) + '.</span>' : '') +
          (p.informativa ? '<a href="' + esc(p.informativa) + '" target="_blank" rel="noopener" style="font-size:15px;font-weight:600;padding-top:8px">Leggi l\'informativa completa</a>' : '') + '</section>' +
        '';
    },

    manuale: function () {
      var d = S.d, q = S.ric;
      var giaFatta = function (t) { return q.data === d.oggi && (d.fatteOggi || []).indexOf(t) >= 0; };
      var tipi = d.tipiRichiesta.map(function (t) {

      }).join('');
      var min = new Date(Date.now() - 31 * 86400000);
      var minTesto = min.getFullYear() + '-' + ('0' + (min.getMonth() + 1)).slice(-2) + '-' + ('0' + min.getDate()).slice(-2);
      var mie = (d.richieste || []).map(function (x) {

          (x.risposta ? '<span class="muted" style="font-size:14px">Responsabile: ' + esc(x.risposta) + '</span>' : '') +
          (x.stato === 'Chiarimenti richiesti' ? (S.rispondi === x.id
            ? '<textarea class="input" id="risp-testo" rows="2" maxlength="300" placeholder="La tua risposta"></textarea><button class="btn btn-blu" data-a="invia-risposta" data-id="' + esc(x.id) + '"' + (S.occupato ? ' disabled' : '') + '>Invia risposta</button>'

          '</div>';
      }).join('');
      return '' +
        '<button class="link" data-a="home" style="align-self:flex-start;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:6px">' + ICONE.indietro + 'Indietro</button>' +
        '<div style="display:flex;flex-direction:column;gap:6px"><h1 style="font-size:28px">Timbratura dimenticata</h1>' +
        '<p class="muted" style="font-size:15px;line-height:1.4">Hai dimenticato di timbrare? Chiedila qui: non conta finché il responsabile non la approva, e vedrai la sua decisione nelle notifiche.</p></div>' +

        '<div class="scelte">' +
          '<div class="campo"><label for="ric-data">Giorno</label><input class="input" id="ric-data" data-c="data" type="date" min="' + esc(minTesto) + '" max="' + esc(d.oggi) + '" value="' + esc(q.data) + '"></div>' +
          '<div class="campo"><label for="ric-ora">Orario giusto</label><input class="input" id="ric-ora" data-c="ora" type="time" value="' + esc(q.ora) + '"></div>' +
        '</div>' +
        '<div class="campo"><label for="ric-nota">Motivazione</label><textarea class="input" id="ric-nota" data-c="nota" rows="2" maxlength="300" placeholder="Es. il telefono si è spento alle 7:40">' + esc(q.nota) + '</textarea></div>' +
        '<div class="campo"><span style="font-weight:600;font-size:15px">Allegato (facoltativo)</span>' +
          '<label class="btn btn-bordo" for="ric-allegato" style="display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer">' + ICONE.camera + (q.allegato ? 'Foto pronta · cambiala' : 'Aggiungi una foto') + '</label>' +
          '<input id="ric-allegato" type="file" accept="image/*" hidden>' +
          '<span class="muted" style="font-size:13px">Per esempio la foto del foglio presenze firmato o di un errore sullo schermo.</span></div>' +
        (S.ricErrore ? '<span class="errore" role="alert">' + esc(S.ricErrore) + '</span>' : '') +
        '<button class="btn btn-blu" data-a="invia-richiesta"' + (S.occupato ? ' disabled' : '') + '>' + (S.occupato ? 'Invio…' : 'Invia la richiesta') + '</button>' +
        (mie ? '<section class="card" aria-label="Le mie richieste" style="display:flex;flex-direction:column;gap:0"><span class="etichetta" style="padding-bottom:6px">Le mie richieste</span>' + mie + '</section>' : '');
    },

    storico: function () {
      var st = S.storico;
      var testa = '<button class="link" data-a="home" style="align-self:flex-start;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:6px">' + ICONE.indietro + 'Indietro</button>' +
        '<h1 style="font-size:28px">Le mie timbrature</h1>';
      if (!st) {
        return testa + (S.storicoErrore ? '<span class="errore" role="alert">' + esc(S.storicoErrore) + '</span><button class="btn btn-blu" data-a="storico">Riprova</button>'
          : '<div class="centro"><span class="blu-tinta icona-piccola">' + ICONE.gira + '</span><p class="muted">Carico…</p></div>');
      }
      var colori = { 'Confermata': 'chip-blu', 'In corso': 'chip-blu', 'Da confermare': 'chip-arancio', 'In attesa': 'chip-arancio', 'Incompleta': 'chip-grigio',
        'Ferie': 'chip-blu', 'Permesso': 'chip-blu', 'Malattia': 'chip-grigio' };
      var giorni = st.giorni.map(function (g) {
        var testa = '<div class="riga" style="justify-content:space-between"><b style="font-size:16px;font-weight:600">' + esc(g.giorno) + '</b>' +
          '<span class="chip ' + (colori[g.stato] || 'chip-grigio') + '" style="align-self:center">' + esc(g.stato) + '</span></div>';
        if (!g.entrata && !g.uscita) return '<div class="card giorno">' + testa + '</div>';
        return '<div class="card giorno">' + testa +
          '<div class="orari"><span>Entrata <strong>' + esc(g.entrata || '—') + '</strong></span><span>Uscita <strong>' + esc(g.uscita || '—') + '</strong></span>' +
          (g.pausa ? '<span>Pausa <strong>' + esc(g.pausa) + '</strong></span>' : '') +
          '<span>Ore <strong>' + esc(g.ore || '—') + '</strong>' + (g.extra ? ' <span style="color:' + (g.extra.charAt(0) === '+' ? 'var(--blue-dark)' : 'var(--orange-dark)') + ';font-weight:600">' + esc(g.extra) + '</span>' : '') + '</span></div>' +
          (g.nota ? '<span class="muted" style="font-size:14px">' + esc(g.nota) + '</span>' : '') + '</div>';
      }).join('');
      var c = st.conferma;
      var conferma = c.fatta ? '<div class="avviso avviso-blu">' + ICONE.check.replace('width="22" height="22"', 'width="18" height="18"') + '<span>Hai confermato le ore di questo mese il ' + esc(c.fatta.slice(8, 10) + '/' + c.fatta.slice(5, 7)) + '.</span></div>'
        : c.possibile ? '<div class="card" style="display:flex;flex-direction:column;gap:10px"><b style="font-weight:600">Le ore di ' + esc(st.meseTesto) + ' sono giuste?</b>' +
          '<span class="muted" style="font-size:14px;line-height:1.4">Controlla i giorni qui sotto. Se è tutto giusto, confermalo: così non ci sono discussioni dopo. Se qualcosa non torna, parlane con il responsabile.</span>' +
          (S.storicoErrore ? '<span class="errore" role="alert">' + esc(S.storicoErrore) + '</span>' : '') +
          '<button class="btn btn-blu" data-a="conferma-mese" data-v="' + esc(st.mese) + '"' + (S.occupato ? ' disabled' : '') + '>Confermo le mie ore</button></div>'
        : (c.motivo && !(c.contestata && c.contestata.stato === 'In attesa') ? '<p class="muted" style="font-size:14px;line-height:1.4">' + esc(c.motivo) + '</p>' : '');
      
      var finito = st.meseFinito;
      var ct = c.contestata;
      var contestazione = ct ? '<div class="avviso ' + (ct.stato === 'In attesa' ? 'avviso-arancio' : 'avviso-blu') + '" style="text-align:left;flex-direction:column;align-items:flex-start;gap:4px">' +
          '<b style="font-weight:600">Hai contestato le ore · ' + esc(ct.stato === 'In attesa' ? 'in attesa di risposta' : ct.stato.toLowerCase()) + '</b><span>«' + esc(ct.motivo) + '»</span>' +
          (ct.risposta ? '<span>Risposta del responsabile: ' + esc(ct.risposta) + '</span>' : '') + '</div>' : '';
      var puoContestare = finito && st.statoMese !== 'Chiuso' && !(ct && ct.stato === 'In attesa');
      var formContesta = !puoContestare ? '' : !S.contesta ? '<button class="link" data-a="contesta-apri" style="align-self:flex-start">Qualcosa non torna? Contesta le ore</button>'
        : '<div class="card" style="display:flex;flex-direction:column;gap:10px"><label for="contesta-motivo" style="font-weight:600">Cosa non torna? Scrivi giorno e orario</label>' +
          '<textarea id="contesta-motivo" class="input" data-contesta="1" rows="3" maxlength="400" placeholder="Es. martedì 14 sono uscito alle 18:00, non alle 17:30">' + esc(S.contesta.motivo || '') + '</textarea>' +
          (S.contestaErrore ? '<span class="errore" role="alert">' + esc(S.contestaErrore) + '</span>' : '') +
          '<div class="riga" style="gap:8px"><button class="btn btn-blu" data-a="contesta-invia"' + (S.occupato ? ' disabled' : '') + '>Invia al responsabile</button>' +
          '<button class="btn btn-bordo" data-a="contesta-chiudi">Annulla</button></div></div>';
      var pdf = st.giorni.length ? (S.pdf && S.pdf.mese === st.mese && S.pdf.url
          ? '<a class="btn btn-bordo" style="text-decoration:none" href="' + S.pdf.url + '" download="' + esc(S.pdf.nome) + '" target="_blank" rel="noopener">Apri il PDF di ' + esc(st.meseTesto) + '</a>'
          : '<button class="link" data-a="pdf-mese" data-v="' + esc(st.mese) + '" style="align-self:flex-start"' + (S.occupato ? ' disabled' : '') + '>' + (S.pdf && S.pdf.mese === st.mese && S.pdf.carico ? 'Preparo il PDF…' : 'Scarica il riepilogo in PDF') + '</button>') +
          (S.pdf && S.pdf.mese === st.mese && S.pdf.errore ? '<span class="errore" role="alert">' + esc(S.pdf.errore) + '</span>' : '') : '';
      conferma += contestazione + formContesta;
      return testa +
        '<div class="mesi">' +
          '<button class="freccia" data-a="mese" data-v="' + esc(st.mesePrec) + '" aria-label="Mese precedente"' + (st.mesePrec ? '' : ' disabled') + '>' + ICONE.indietro + '</button>' +

          '<button class="freccia" data-a="mese" data-v="' + esc(st.meseSucc) + '" aria-label="Mese successivo"' + (st.meseSucc ? '' : ' disabled') + '>' + ICONE.avanti + '</button>' +
        '</div>' +
        '<div class="card totali">' +
          '<div><span class="muted" style="font-size:13px">Giorni lavorati</span><b>' + esc(st.totale.giorni) + '</b></div>' +
          '<div><span class="muted" style="font-size:13px">Ore confermate</span><b>' + esc(st.totale.oreConfermate) + '</b></div>' +
          (st.totale.oreDaConfermare ? '<div><span class="muted" style="font-size:13px">Ancora da confermare</span><b style="color:var(--orange-dark)">' + esc(st.totale.oreDaConfermare) + '</b></div>' : '') +
          (st.totale.straordinari ? '<div><span class="muted" style="font-size:13px">Ore in più</span><b style="color:var(--blue-dark)">' + esc(st.totale.straordinari) + '</b></div>' : '') +
        '</div>' + conferma +
        (giorni || '<div class="card muted" style="text-align:center;padding:24px 16px">Nessuna timbratura in questo mese.</div>') +
        '<p class="muted" style="font-size:13px;line-height:1.4">«Da confermare»: c\'è qualcosa che il responsabile deve ancora controllare. «Incompleta»: manca una timbratura.</p>' +
        (st.statoMese && finito ? '<p class="muted" style="font-size:13px">Stato del mese: ' + esc(st.statoMese) + '</p>' : '') + pdf;
    },

    informativa: function () {
      var d = S.d;
      return '<span class="chip chip-blu">Privacy</span>' +
        '<h1>Come usiamo i tuoi dati</h1>' +
        '<div class="card" style="display:flex;flex-direction:column;gap:8px"><ul class="elenco" style="font-size:15px">' +

          '<li>Niente impronte né riconoscimento facciale.</li>' +
          '<li>Le timbrature servono per le presenze e le ore di lavoro e le vede solo il responsabile.</li>' +

        '</ul>' + (d.informativa ? '<a href="' + esc(d.informativa) + '" target="_blank" rel="noopener" style="font-size:15px;font-weight:600">Leggi l\'informativa completa</a>' : '') + '</div>' +
        (S.messaggio ? '<span class="errore" role="alert">' + esc(S.messaggio) + '</span>' : '') +
        '<div class="spazio"></div>' +
        '<button class="btn btn-blu" data-a="accetta"' + (S.occupato ? ' disabled' : '') + '>' + (S.occupato ? 'Salvo…' : 'Ho letto e accetto') + '</button>';
    },

      var d = S.d;

      var lista = d.assenze.map(function (a) {
        return '<div class="card" style="display:flex;flex-direction:column;gap:6px"><div class="riga" style="justify-content:space-between">' +

      }).join('');

        '<h1 style="font-size:28px">Ferie e permessi</h1>' +

        (lista || '<div class="card muted" style="text-align:center;padding:24px 16px">Nessuna richiesta finora.</div>');

    'nuova-assenza': function () {

      }).join('');

        ? '<div class="campo"><label for="ass-dal">Giorno</label><input class="input" id="ass-dal" data-ass="dal" type="date" min="' + esc(d.oggi) + '" value="' + esc(q.dal) + '"></div>'
        : giornaliera

        (pausa ? '<p class="muted" style="font-size:14px;line-height:1.4">Se il responsabile approva, quel giorno fai l\'orario continuato: lavori anche nella pausa pranzo senza fermarti, non timbri la pausa e quell\'ora ti viene contata.</p>' : '') +
        '<div class="campo"><label for="ass-nota">Nota (facoltativa)</label><textarea class="input" id="ass-nota" data-ass="nota" rows="2" maxlength="300">' + esc(q.nota) + '</textarea></div>' +
        (S.assErrore ? '<span class="errore" role="alert">' + esc(S.assErrore) + '</span>' : '') +

    inviata: function () {

  };

  

  function vistiNotifiche() {
    var v = {};
    try { (JSON.parse(leggiMem('tm_visti') || '[]')).forEach(function (k) { v[k] = true; }); } catch (e) {}
    return v;
  }
  function segnalazioni(d) {
    var lista = d.notifiche || [];
    if (!lista.length) return '';
    var visti = vistiNotifiche();
    var nuove = lista.filter(function (x) { return !visti[x.id]; }).length;
    var voce = function (x) {
      return '<div class="segn"><div class="segn-testa"><b>' + esc(x.tipo) + '</b>' + (S.nuoveViste && S.nuoveViste[x.id] ? '<span class="chip chip-arancio">Nuova</span>' : '') + '</div>' +
        '<span class="muted" style="font-size:13px">' + esc(x.quando) + '</span>' +
        '<span style="font-size:14px;line-height:1.4">' + esc(x.testo) + '</span></div>';
    };
    var gruppo = function (titolo, classe, elenco) {
      if (!elenco.length) return '';
      return '<div style="display:flex;flex-direction:column;gap:8px"><span class="chip ' + classe + '" style="align-self:flex-start">' + titolo + ' · ' + elenco.length + '</span>' +
        elenco.map(voce).join('') + '</div>';
    };
    var di = function (e) { return lista.filter(function (x) { return x.esito === e; }); };
    var testa = '<button class="segn-apri" data-a="segn-apri" aria-expanded="' + (S.segnAperte ? 'true' : 'false') + '">' +
      '<span class="etichetta" style="flex:1;text-align:left">Notifiche</span>' +
      (nuove ? '<span class="pallino-rosso">' + nuove + (nuove === 1 ? ' nuova' : ' nuove') + '</span>' : '<span class="muted" style="font-size:13px">' + lista.length + '</span>') +
      '<span class="segn-freccia' + (S.segnAperte ? ' su' : '') + '" aria-hidden="true">›</span></button>';
    return '<section class="card" style="padding:12px 16px;display:flex;flex-direction:column;gap:12px" aria-label="Le tue notifiche">' + testa +
      (S.segnAperte ? gruppo('Approvate', 'chip-verde', di('approvata')) + gruppo('Non approvate', 'chip-rosso', di('rifiutata')) + gruppo('Altri avvisi', 'chip-grigio', di('avviso')) : '') +
      '</section>';
  }
   
  function apriChiudiNotifiche() {
    S.segnAperte = !S.segnAperte;
    if (S.segnAperte && S.d) {
      var visti = vistiNotifiche();
      S.nuoveViste = {};
      (S.d.notifiche || []).forEach(function (x) { if (!visti[x.id]) S.nuoveViste[x.id] = true; visti[x.id] = true; });
      try { salvaMem('tm_visti', JSON.stringify(Object.keys(visti).slice(-80))); } catch (e) {}
    } else {
      S.nuoveViste = {};
    }
    disegna();
  }

  function disegna() {
    app.innerHTML = VISTE[S.schermata]();
    if (S.schermata === 'home' && S.d && S.d.prossimo) preparaPosizione();
  }

   

  function oggiLocale() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
   
  function minutiAdesso() {
    if (S.base) return (S.base.minuti + Math.floor((Date.now() - S.base.client) / 60000)) % 1440;
    var d = new Date();
    return d.getHours() * 60 + d.getMinutes();
  }
  function testoOra(m) { return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + (m % 60)).slice(-2); }
  function ricordaDati(r) {
    if (r && typeof r.orologio === 'number') S.base = { minuti: r.orologio, client: Date.now() };
    S.d = r;
    try { window.localStorage.setItem('tm_stato', JSON.stringify(r)); } catch (e) {}
  }
  function datiRicordati() {
    try {
      var r = JSON.parse(window.localStorage.getItem('tm_stato') || 'null');
      return r && r.oggi === oggiLocale() ? r : null;
    } catch (e) { return null; }
  }

  function caricaStato(silenzioso) {
    var c = codice();
    if (!c) { if (!silenzioso) vai('accesso'); return Promise.resolve(); }
    if (!silenzioso) vai('carico');
    var sospesa = leggiSospesa();
    return chiama('stato', cred({ sospeso: sospesa ? sospesa.id : '' })).then(function (r) {
      if (r.ok && r.sospeso) {
        S.messaggio = r.sospeso.registrata ? 'La tua ultima timbratura (' + r.sospeso.tipo.toLowerCase() + ' alle ' + r.sospeso.ora + ') è stata registrata.'
          : 'L\'ultima timbratura non è arrivata al server: se serve, timbra di nuovo.';
        togliSospesa();
      }
      if (r.ok) { ricordaDati(r); if (r.serveInformativa) { if (S.schermata !== 'informativa') vai('informativa'); } else if (!silenzioso || S.schermata === 'home') vai('home'); }
      else serveAccesso(r);
    }).catch(function (e) {
      if (!silenzioso) { S.problema = { tipo: 'errore', messaggio: testoErrore(e) }; vai('problema'); }
    });
  }

   
  var ACCESSO = { codice: true, pin: true, accesso: true, dispositivo: true, 'altro-telefono': true, computer: true };
  function serveAccesso(r) {
    togliMem('tm_stato');
    if (r.motivo === 'codice') { togliMem('tm_cod'); togliMem('tm_disp'); S.codiceAccesso = ''; }
    else S.codiceAccesso = codice();
    if (r.motivo === 'dispositivo') togliMem('tm_disp');
    S.nomeAccesso = r.nome || '';
    S.erroreAccesso = r.motivo === 'accesso' || r.motivo === 'pin' ? '' : r.messaggio;
    S.infoAccesso = r.motivo === 'accesso' ? r.messaggio : r.motivo === 'dispositivo' ? r.messaggio : '';
    if (r.motivo === 'altro-telefono') { S.erroreAccesso = ''; S.infoRecupero = r.messaggio; vai('recupero'); return; }
    if (r.motivo === 'computer') { vai('computer'); return; }
    vai(r.motivo === 'pin' ? 'scegli-pin' : 'accesso');
  }

  function soloCifre(id) { var c = document.getElementById(id); return (c && c.value || '').replace(/\D/g, ''); }

  function entrato(r, c, messaggio) {
    salvaMem('tm_cod', c);
    if (r.dispositivo) salvaMem('tm_disp', r.dispositivo);
    S.erroreAccesso = ''; S.infoAccesso = ''; S.codiceAccesso = '';
    ricordaDati(r);
    S.messaggio = messaggio || 'Telefono collegato. Da ora timbri da qui.';
    vai(r.serveInformativa ? 'informativa' : 'home');
  }

  function accedi() {
    var c = soloCifre('codice') || S.codiceAccesso || codice();
    var pin = soloCifre('pin');
    if (c.length < 4) { S.erroreAccesso = 'Scrivi il codice personale.'; disegna(); return; }
    if (pin.length && pin.length !== 6) { S.erroreAccesso = 'Il PIN ha 6 cifre.'; S.codiceAccesso = c; disegna(); return; }
    S.occupato = true; S.erroreAccesso = ''; S.codiceAccesso = c; disegna();
    chiama('accedi', cred({ codice: c, pin: pin, descrizione: descriviTelefono(), accetto: true })).then(function (r) {
      S.occupato = false;
      if (r.ok) entrato(r, c);
      else if (r.motivo === 'pin-nuovo') { S.nomeAccesso = r.nome || ''; S.erroreAccesso = ''; vai('scegli-pin'); }
      else if (r.motivo === 'altro-telefono') { S.nomeAccesso = r.nome || ''; S.erroreAccesso = ''; S.infoRecupero = r.messaggio; vai('recupero'); }
      else if (r.motivo === 'computer') vai('computer');
      else { S.erroreAccesso = r.messaggio; vai('accesso'); }
    }).catch(function (e) { S.occupato = false; S.erroreAccesso = testoErrore(e); vai('accesso'); });
  }

  function scegliPin() {
    var c = S.codiceAccesso || codice();
    var p1 = soloCifre('pin1'), p2 = soloCifre('pin2');
    if (p1.length !== 6) { S.erroreAccesso = 'Il PIN deve avere 6 cifre.'; disegna(); return; }
    if (p1 !== p2) { S.erroreAccesso = 'I due PIN non sono uguali.'; disegna(); return; }
    S.occupato = true; S.erroreAccesso = ''; disegna();
    chiama('accedi', cred({ codice: c, nuovoPin: p1, descrizione: descriviTelefono(), accetto: true })).then(function (r) {
      S.occupato = false;
      if (r.ok) entrato(r, c, 'Fatto: questo telefono è registrato a te e il PIN è salvato. Tienilo per te: serve se il telefono perde i dati.');
      else if (r.motivo === 'altro-telefono') { S.erroreAccesso = ''; S.infoRecupero = r.messaggio; vai('recupero'); }
      else if (r.motivo === 'computer') vai('computer');
      else { S.erroreAccesso = r.messaggio; vai(r.motivo === 'pin-nuovo' ? 'scegli-pin' : 'accesso'); }
    }).catch(function (e) { S.occupato = false; S.erroreAccesso = testoErrore(e); disegna(); });
  }

  function recuperaPin() {
    var c = soloCifre('rec-codice') || S.codiceAccesso || codice();
    var rec = ((document.getElementById('rec-chiave') || {}).value || '').replace(/\s/g, '').toUpperCase();
    var p1 = soloCifre('rec-pin1'), p2 = soloCifre('rec-pin2');
    if (c.length < 4 || rec.length < 6) { S.erroreAccesso = 'Scrivi il codice personale e il codice di registrazione.'; disegna(); return; }
    if (p1.length !== 6 || p1 !== p2) { S.erroreAccesso = 'Scrivi due volte lo stesso PIN di 6 cifre.'; disegna(); return; }
    S.occupato = true; S.erroreAccesso = ''; disegna();
    chiama('recuperaPin', cred({ codice: c, recupero: rec, nuovoPin: p1, descrizione: descriviTelefono() })).then(function (r) {
      S.occupato = false;
      if (r.ok) { S.infoRecupero = ''; entrato(r, c, 'Telefono registrato: da ora timbri da qui. Il telefono vecchio non funziona più.'); }
      else if (r.motivo === 'computer') vai('computer');
      else { S.erroreAccesso = r.messaggio; disegna(); }
    }).catch(function (e) { S.occupato = false; S.erroreAccesso = testoErrore(e); disegna(); });
  }

  

  var POS = { ultima: null, quando: 0, watch: null, timer: null };
  function preparaPosizione() {
    if (!navigator.geolocation || POS.watch !== null || POS.controllo) return;
    POS.controllo = true;
    var avvia = function () {
      POS.controllo = false;
      if (POS.watch !== null || S.schermata !== 'home') return;
      try {
        POS.watch = navigator.geolocation.watchPosition(function (p) {
          var nuova = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
          if (!POS.ultima || nuova.acc <= POS.ultima.acc || Date.now() - POS.quando > 8000) { POS.ultima = nuova; POS.quando = Date.now(); }
        }, function (err) { if (err && err.code === 1) fermaPosizione(); }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 });
      } catch (e) { POS.watch = null; return; }
      clearTimeout(POS.timer);
      POS.timer = setTimeout(fermaPosizione, 120000);
    };
    try {
      if (navigator.permissions && navigator.permissions.query) {
        navigator.permissions.query({ name: 'geolocation' }).then(function (st) {
          if (st.state === 'granted') avvia(); else POS.controllo = false;
        }, function () { avvia(); });
        return;
      }
    } catch (e) {   }
    avvia();
  }
  function fermaPosizione() {
    if (POS.watch !== null) { try { navigator.geolocation.clearWatch(POS.watch); } catch (e) {} }
    POS.watch = null;
    clearTimeout(POS.timer);
  }
   
  function posizionePronta() {
    return POS.ultima && Date.now() - POS.quando < 30000 && POS.ultima.acc <= 150 ? POS.ultima : null;
  }

   
  function leggiPosizione() {
    function chiedi(opzioni) {
      return new Promise(function (ok) {
        navigator.geolocation.getCurrentPosition(function (p) {
          ok({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy });
        }, function (err) {
          ok({ errore: err && err.code === 1 ? 'negato' : err && err.code === 3 ? 'tempo' : 'nd' });
        }, opzioni);
      });
    }
    if (!navigator.geolocation) return Promise.resolve({ errore: 'nd' });
    return chiedi({ enableHighAccuracy: false, timeout: 5000, maximumAge: 0 }).then(function (veloce) {
      if (!veloce.errore && veloce.acc <= 150) return veloce;
      if (veloce.errore === 'negato') return veloce;
      return chiedi({ enableHighAccuracy: true, timeout: 12000, maximumAge: 5000 }).then(function (precisa) {
        return precisa.errore && !veloce.errore ? veloce : precisa;
      });
    });
  }

  function avviaTimbratura() {
    if (S.occupato || !S.d || !S.d.prossimo) return;
    var p = S.d.prossimo;
    if (S.tipoScelto === 'Uscita' && p.tipo !== 'Uscita') p = { tipo: 'Uscita', serveFoto: false, fotoObbligatoria: false };
    if (S.accettoTogli === null) {
      var anticipo = calcolaAnticipo(p);
      if (anticipo) { S.anticipo = anticipo; S.tipo = p.tipo; vai('anticipo'); return; }
    }
    S.occupato = true; S.messaggio = ''; S.tipo = p.tipo; S.problemaFoto = ''; S.fotoObbligatoria = !!p.fotoObbligatoria;
    if (!S.richiesta) S.richiesta = nuovaRichiesta();
    S.controlli = { posizione: 'run', telefono: 'wait', orario: 'wait' };
    var pronta = posizionePronta();
    vai('verifica');
    (pronta ? Promise.resolve(pronta) : leggiPosizione()).then(function (pos) {
      S.posizione = pos;
      if (p.serveFoto && !pos.errore) { S.occupato = false; vai('selfie'); return; }
      invia(null);
    });
  }

  

  function calcolaAnticipo(p) {
    var u = p && p.tipo === 'Uscita' ? p.uscita : null;
    if (!u) return null;
    var ora = minutiAdesso();
    if (ora >= u.limite - (u.tolleranza || 0)) return null;   
    var da = Math.max(ora, u.inizio);
    var persi = Math.max(0, u.limite - da);
    if (u.pausa) persi -= Math.max(0, Math.min(u.limite, u.pausa[1]) - Math.max(da, u.pausa[0]));
    if (persi <= 0) return null;
    var blocco = Math.max(1, u.blocco || 1);
    return { ora: testoOra(ora), limite: u.limiteTesto,
      tolti: Math.ceil(persi / blocco) * blocco, blocco: blocco, daServer: false };
  }

  function durataTesto(m) {
    m = Math.round(m || 0);
    return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + ('0' + (m % 60)).slice(-2) : '');
  }

  function azzeraAnticipo() { S.anticipo = null; S.accettoTogli = null; S.ultimaFoto = null; }

  function invia(foto) {
    S.occupato = true;
    S.ultimaFoto = foto || null;
    S.controlli = { posizione: 'run', telefono: 'run', orario: 'run' };
    vai('verifica');
    if (!S.richiesta) S.richiesta = nuovaRichiesta();
    segnaSospesa(S.richiesta, S.tipo);
    chiamaConRiprova('timbra', cred({ atteso: S.tipo, posizione: S.posizione, foto: foto, accettoTogli: S.accettoTogli, richiesta: S.richiesta,
        tipoScelto: S.tipoScelto || '', motivoUscita: S.vaVia && S.tipoScelto ? S.vaVia.motivo : '', notaUscita: S.vaVia && S.tipoScelto ? S.vaVia.nota : '' }))
      .then(mostraEsito)
      .catch(function (e) {
        
        S.occupato = false; S.erroreInvio = testoErrore(e); vai('errore-invio');
      });
  }

   
  function bollaResponsabile(testo) {
    if (!testo) return '';
    return '<div role="note" style="align-self:stretch;text-align:left;background:#FFF7E0;border:1px solid #F2D27A;border-radius:18px 18px 18px 4px;padding:12px 14px;display:flex;flex-direction:column;gap:4px">' +
      '<span style="font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#8A6300">💬 Dal responsabile</span>' +
      '<span style="font-size:17px;line-height:1.35;color:var(--ink)">' + esc(testo) + '</span></div>';
  }

  function mostraEsito(r) {
    var c = r.controlli || {};
    var finale = {
      posizione: c.posizione || (r.ok ? 'ok' : 'wait'),
      telefono: (r.motivo === 'fuori' || r.motivo === 'posizione' || r.motivo === 'presto') ? 'wait' : (c.telefono || 'ok'),
      orario: (r.motivo === 'fuori' || r.motivo === 'posizione') ? 'wait' : (c.orario || 'ok')
    };
    if (r.motivo === 'presto') finale.posizione = 'wait';
    if (!r.ok && !r.controlli) { dopoControlli(r); return; }
    S.controlli = finale;
    disegna();
    setTimeout(function () { dopoControlli(r); }, r.ok ? 150 : 450);
  }

  function dopoControlli(r) {
    S.occupato = false;
    togliSospesa();
    if (ACCESSO[r.motivo]) { S.richiesta = null; serveAccesso(r); return; }
    if (r.motivo !== 'anticipo') S.richiesta = null;
    if (r.motivo === 'anticipo') {
      
      var blocco = S.d && S.d.prossimo && S.d.prossimo.uscita ? S.d.prossimo.uscita.blocco : 1;
      S.anticipo = { ora: r.ora, limite: r.limite, tolti: r.tolti, blocco: blocco, daServer: true };
      S.accettoTogli = null;
      vai('anticipo');
      return;
    }
    azzeraAnticipo();
    if (r.ok) {
      if (S.tipoScelto && S.vaVia && S.vaVia.motivo === 'Non sto bene') r.consiglio = 'Riguardati! Se domani non puoi venire, manda la malattia da «Ferie e permessi».';
      S.tipoScelto = null; S.vaVia = null;
      S.esito = r;
      fermaPosizione(); POS.ultima = null;
      vai('fatto');
      caricaStato(true);
      try { window.localStorage.removeItem('tm_stato'); } catch (e) {}
      return;
    }
    if (r.motivo === 'codice') { togliMem('tm_cod'); S.erroreAccesso = r.messaggio; vai('accesso'); return; }
    if (r.motivo === 'cambiato' || r.motivo === 'finito' || r.motivo === 'riposo' || r.motivo === 'doppia') { S.messaggio = r.messaggio; caricaStato(false); return; }
    var tipo = r.motivo === 'fuori' ? 'fuori' : r.motivo === 'posizione' ? 'posizione' : r.motivo === 'presto' ? 'presto' : 'errore';
    S.problema = { tipo: tipo, messaggio: r.messaggio || 'Riprova tra poco.', posizione: r.posizione || '', assistita: !!r.assistita, soloRiprova: !!r.soloRiprova, dalResponsabile: r.dalResponsabile || '' };
    vai('problema');
  }

  function comprimiFoto(file) {
    return new Promise(function (ok, ko) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var max = 720;
        var k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.naturalWidth * k);
        canvas.height = Math.round(img.naturalHeight * k);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        ok(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = function () { URL.revokeObjectURL(url); ko(new Error('Non riesco a leggere la foto.')); };
      img.src = url;
    });
  }

  var inputFoto = document.getElementById('foto-input');
  inputFoto.addEventListener('change', function () {
    var f = inputFoto.files && inputFoto.files[0];
    inputFoto.value = '';
    if (!f) return;
    S.occupato = true; disegna();
    comprimiFoto(f).then(function (dataUrl) { invia(dataUrl); })
      .catch(function (e) { S.occupato = false; S.problemaFoto = testoErrore(e) + ' Riprova.'; disegna(); });
  });

  function apriManuale() {
    var d = S.d;
    var hh = testoOra(minutiAdesso());
    S.ric = {
      tipo: (d.prossimo && d.prossimo.tipo) || d.tipiRichiesta[d.tipiRichiesta.length - 1],
      data: d.oggi, ora: hh, motivo: '', categoria: '', nota: '', allegato: ''
    };
    S.ricErrore = '';
    vai('manuale');
  }

  function inviaRichiesta() {
    var q = S.ric;
    if (!q.ora) { S.ricErrore = "Scrivi l'orario."; disegna(); return; }
    if (!String(q.nota || '').trim()) { S.ricErrore = 'Scrivi la motivazione.'; disegna(); return; }
    S.occupato = true; S.ricErrore = ''; disegna();
    chiama('richiesta', cred({ tipo: q.tipo, data: q.data, ora: q.ora, nota: q.nota, allegato: q.allegato || '' }))
      .then(function (r) {
        S.occupato = false;
        if (r.ok) { S.ricRiepilogo = r.riepilogo; vai('inviata'); }
        else if (ACCESSO[r.motivo]) serveAccesso(r);
        else { S.ricErrore = r.messaggio; disegna(); }
      })
      .catch(function (e) { S.occupato = false; S.ricErrore = testoErrore(e); disegna(); });
  }

  function apriStorico(mese) {
    S.storico = null; S.storicoErrore = ''; S.contesta = null; S.contestaErrore = '';
    vai('storico');
    chiama('storico', cred({ mese: mese || '' })).then(function (r) {
      if (r.ok) { S.storico = r; disegna(); }
      else if (ACCESSO[r.motivo]) serveAccesso(r);
      else { S.storicoErrore = r.messaggio || 'Riprova.'; disegna(); }
    }).catch(function (e) { S.storicoErrore = testoErrore(e); disegna(); });
  }

  function apriNuovaAssenza() {
    S.ass = { tipo: 'Ferie', dal: S.d.oggi, al: S.d.oggi, ora: '', nota: '' };
    S.assErrore = '';
    vai('nuova-assenza');
  }

  function inviaAssenza() {
    var q = S.ass;
    S.occupato = true; S.assErrore = ''; disegna();
    chiama('richiestaAssenza', cred({ tipo: q.tipo, dal: q.dal, al: q.al, ora: q.ora, nota: q.nota }))
      .then(function (r) {
        S.occupato = false;
        if (r.ok) { ricordaDati(r); S.assMessaggio = 'Richiesta inviata: ' + q.tipo.toLowerCase() + ' ' + r.inviata + '.'; vai('assenze'); }
        else if (ACCESSO[r.motivo]) serveAccesso(r);
        else { S.assErrore = r.messaggio; disegna(); }
      })
      .catch(function (e) { S.occupato = false; S.assErrore = testoErrore(e); disegna(); });
  }

  var AZIONI = {
    'segn-apri': apriChiudiNotifiche,
    accedi: accedi,
    accetta: function () {
      S.occupato = true; S.messaggio = ''; disegna();
      chiama('accettaInformativa', cred()).then(function (r) {
        S.occupato = false;
        if (r.ok) { ricordaDati(r); vai('home'); }
        else serveAccesso(r);
      }).catch(function (e) { S.occupato = false; S.messaggio = testoErrore(e); disegna(); });
    },
    assenze: function () { S.assMessaggio = ''; vai('assenze'); },
    'nuova-assenza': apriNuovaAssenza,
    'ass-tipo': function (el) { S.ass.tipo = el.getAttribute('data-v'); S.assErrore = ''; disegna(); },
    'invia-assenza': inviaAssenza,
    'conferma-mese': function (el) {
      var mese = el.getAttribute('data-v');
      S.occupato = true; S.storicoErrore = ''; disegna();
      chiama('confermaMese', cred({ mese: mese })).then(function (r) {
        S.occupato = false;
        if (r.ok) { S.storico = r; disegna(); }
        else if (ACCESSO[r.motivo]) serveAccesso(r);
        else { S.storicoErrore = r.messaggio; disegna(); }
      }).catch(function (e) { S.occupato = false; S.storicoErrore = testoErrore(e); disegna(); });
    },
    'contesta-apri': function () { S.contesta = { motivo: '' }; S.contestaErrore = ''; disegna(); var t = document.getElementById('contesta-motivo'); if (t) t.focus(); },
    'contesta-chiudi': function () { S.contesta = null; disegna(); },
    'contesta-invia': function () {
      var motivo = (S.contesta && S.contesta.motivo || '').trim();
      if (!motivo) { S.contestaErrore = 'Scrivi cosa non torna (giorno e orario).'; disegna(); return; }
      S.occupato = true; S.contestaErrore = ''; disegna();
      chiama('contestaMese', cred({ mese: S.storico.mese, motivo: motivo })).then(function (r) {
        S.occupato = false;
        if (r.ok) { S.storico = r; S.contesta = null; disegna(); }
        else if (ACCESSO[r.motivo]) serveAccesso(r);
        else { S.contestaErrore = r.messaggio; disegna(); }
      }).catch(function (e) { S.occupato = false; S.contestaErrore = testoErrore(e); disegna(); });
    },
    'pdf-mese': function (el) {
      var mese = el.getAttribute('data-v');
      S.pdf = { mese: mese, carico: true }; S.occupato = true; disegna();
      chiama('pdfMese', cred({ mese: mese })).then(function (r) {
        S.occupato = false;
        if (!r.ok) { if (ACCESSO[r.motivo]) return serveAccesso(r); S.pdf = { mese: mese, errore: r.messaggio || 'PDF non disponibile.' }; disegna(); return; }
        var url = r.pdf;
        try {
          var bin = atob(r.pdf.split(',')[1]), arr = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
        } catch (e) {}
        S.pdf = { mese: mese, url: url, nome: r.nome }; disegna();
      }).catch(function (e) { S.occupato = false; S.pdf = { mese: mese, errore: testoErrore(e) }; disegna(); });
    },
    privacy: function () {
      S.pv = { tipo: 'Accesso ai miei dati', testo: '' };
      vai('privacy');
      chiama('privacy', cred()).then(function (r) {
        if (r.ok) { S.pv.dati = r; S.pv.tipo = r.tipi[0]; disegna(); }
        else if (ACCESSO[r.motivo]) serveAccesso(r);
        else { S.pv.errore = r.messaggio || 'Riprova.'; disegna(); }
      }).catch(function (e) { S.pv.errore = testoErrore(e); disegna(); });
    },
    'pv-invia': function () {
      var pv = S.pv;
      S.occupato = true; pv.errore = ''; pv.messaggio = ''; disegna();
      chiama('richiestaPrivacy', cred({ tipo: pv.tipo, testo: pv.testo })).then(function (r) {
        S.occupato = false;
        if (r.ok) { pv.dati = r; pv.testo = ''; pv.messaggio = r.messaggio; disegna(); }
        else if (ACCESSO[r.motivo]) serveAccesso(r);
        else { pv.errore = r.messaggio; disegna(); }
      }).catch(function (e) { S.occupato = false; pv.errore = testoErrore(e); disegna(); });
    },
    'pv-dati': function () {
      var pv = S.pv;
      S.occupato = true; pv.carico = true; pv.errore = ''; disegna();
      chiama('mieiDati', cred()).then(function (r) {
        S.occupato = false; pv.carico = false;
        if (!r.ok) { if (ACCESSO[r.motivo]) return serveAccesso(r); pv.errore = r.messaggio; disegna(); return; }
        var url = r.file;
        try {
          var bin = atob(r.file.split(',')[1]), arr = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          url = URL.createObjectURL(new Blob([arr], { type: 'text/csv' }));
        } catch (e) {}
        pv.file = { url: url, nome: r.nome }; disegna();
      }).catch(function (e) { S.occupato = false; pv.carico = false; pv.errore = testoErrore(e); disegna(); });
    },
    storico: function () { apriStorico(''); },
    mese: function (el) { var m = el.getAttribute('data-v'); if (m) apriStorico(m); },
    timbra: avviaTimbratura,
    scatta: function () { if (!S.occupato) { S.problemaFoto = ''; inputFoto.click(); } },
    'senza-foto': function () { if (!S.occupato) invia(null); },
    assistita: function () {
      if (S.occupato) return;
      S.occupato = true; disegna();
      chiamaConRiprova('timbraturaAssistita', cred({ motivo: S.problema && S.problema.posizione === 'impreciso' ? 'impreciso' : 'gps' })).then(function (r) {
        S.occupato = false;
        if (r.ok) { S.messaggio = r.messaggio; vai('home'); caricaStato(true); }
        else if (ACCESSO[r.motivo]) serveAccesso(r);
        else { S.problema = { tipo: 'errore', messaggio: r.messaggio }; vai('problema'); }
      }).catch(function (e) { S.occupato = false; S.problema = { tipo: 'errore', messaggio: testoErrore(e) }; vai('problema'); });
    },
    'scegli-pin': function () { if (!S.occupato) scegliPin(); },
    'recupera-pin': function () { if (!S.occupato) recuperaPin(); },
    'vai-recupero': function () { S.codiceAccesso = soloCifre('codice') || S.codiceAccesso; S.erroreAccesso = ''; S.infoRecupero = ''; vai('recupero'); },
    'vai-accesso': function () { S.erroreAccesso = ''; vai('accesso'); },
    'riprova-invio': function () { if (!S.occupato) invia(S.ultimaFoto); },
    'annulla-invio': function () { togliSospesa(); S.richiesta = null; azzeraAnticipo(); S.tipoScelto = null; S.vaVia = null; vai('home'); caricaStato(true); },
    'anticipo-si': function () {
      if (S.occupato || !S.anticipo) return;
      S.accettoTogli = S.anticipo.tolti;
      if (S.anticipo.daServer && S.posizione) invia(S.ultimaFoto);   
      else avviaTimbratura();
    },
    'anticipo-no': function () { azzeraAnticipo(); S.tipoScelto = null; S.vaVia = null; S.messaggio = ''; if (S.d) vai('home'); },
    home: function () { azzeraAnticipo(); S.tipoScelto = null; S.vaVia = null; S.messaggio = ''; if (S.d) vai('home'); caricaStato(!!S.d); },
    'va-via': function () { S.vaVia = { motivo: '', nota: '', errore: '' }; vai('va-via'); },
    'va-via-motivo': function (el) { S.vaVia.motivo = el.getAttribute('data-v'); S.vaVia.errore = ''; disegna(); },
    'va-via-ok': function () {
      if (!S.vaVia || !S.vaVia.motivo) { S.vaVia.errore = 'Scegli il motivo: il responsabile lo vede.'; disegna(); return; }
      S.tipoScelto = 'Uscita'; S.accettoTogli = null;
      avviaTimbratura();
    },
    ricarica: function () { caricaStato(false); },
    manuale: apriManuale,
    'ric-tipo': function (el) { S.ric.tipo = el.getAttribute('data-v'); disegna(); },
    'ric-categoria': function (el) {
      var c = el.getAttribute('data-v');
      S.ric.categoria = c;
      var tipi = S.d.tipiRichiesta || [];
      if (c === 'Entrata dimenticata' && tipi.indexOf('Entrata') >= 0) S.ric.tipo = 'Entrata';
      if (c === 'Uscita dimenticata' && tipi.indexOf('Uscita') >= 0) S.ric.tipo = 'Uscita';
      if (c === 'Pausa dimenticata' && tipi.indexOf('Inizio pausa') >= 0 && S.ric.tipo !== 'Fine pausa') S.ric.tipo = 'Inizio pausa';
      disegna();
    },
    rispondi: function (el) { S.rispondi = el.getAttribute('data-id'); disegna(); },
    'invia-risposta': function (el) {
      var testo = ((document.getElementById('risp-testo') || {}).value || '').trim();
      if (!testo) { S.ricErrore = 'Scrivi la tua risposta.'; disegna(); return; }
      S.occupato = true; disegna();
      chiama('rispostaChiarimento', cred({ id: el.getAttribute('data-id'), testo: testo })).then(function (r) {
        S.occupato = false;
        if (r.ok) { S.rispondi = ''; S.d.richieste = r.richieste; S.ricErrore = ''; S.messaggio = r.messaggio; disegna(); }
        else if (ACCESSO[r.motivo]) serveAccesso(r);
        else { S.ricErrore = r.messaggio; disegna(); }
      }).catch(function (e) { S.occupato = false; S.ricErrore = testoErrore(e); disegna(); });
    },
    'ric-motivo': function (el) { S.ric.motivo = el.getAttribute('data-v'); disegna(); },
    'invia-richiesta': inviaRichiesta,
    esci: function () { togliMem('tm_cod'); togliMem('tm_stato'); S.d = null; S.erroreAccesso = ''; vai('accesso'); }
  };

  app.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-a]');
    if (!el || el.disabled) return;
    ev.preventDefault();
    var fn = AZIONI[el.getAttribute('data-a')];
    if (fn) fn(el);
  });
  app.addEventListener('input', function (ev) {
    var c = ev.target.getAttribute && ev.target.getAttribute('data-c');
    if (c) S.ric[c] = ev.target.value;
    if (c === 'data' && S.schermata === 'manuale') disegna();
    if (ev.target.getAttribute && ev.target.getAttribute('data-contesta') && S.contesta) S.contesta.motivo = ev.target.value;
    if (ev.target.getAttribute && ev.target.getAttribute('data-vavia') && S.vaVia) S.vaVia.nota = ev.target.value;
    var pvc = ev.target.getAttribute && ev.target.getAttribute('data-pv');
    if (pvc && S.pv) S.pv[pvc] = ev.target.value;
    var a = ev.target.getAttribute && ev.target.getAttribute('data-ass');
    if (a) { S.ass[a] = ev.target.value; if (a === 'dal' && (!S.ass.al || S.ass.al < S.ass.dal)) S.ass.al = S.ass.dal; }
  });
  app.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (ev.target.id === 'form-accesso') accedi();
    if (ev.target.id === 'form-pin') scegliPin();
    if (ev.target.id === 'form-recupero') recuperaPin();
  });
  app.addEventListener('change', function (ev) {
    if (ev.target.id === 'ric-allegato') {
      var f = ev.target.files && ev.target.files[0];
      if (f) comprimiFoto(f).then(function (url) { S.ric.allegato = url; disegna(); }).catch(function () { S.ricErrore = 'Non riesco a leggere la foto.'; disegna(); });
      return;
    }
    if (ev.target.getAttribute && ev.target.getAttribute('data-ass') === 'dal') disegna();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && S.schermata === 'home') { caricaStato(true); preparaPosizione(); }
    if (document.visibilityState === 'hidden') fermaPosizione();
  });

  
  if (apparecchio() !== 'telefono') { vai('computer'); return; }
  function avvia() {
    
    var ricordati = codice() ? datiRicordati() : null;
    if (ricordati) {
      S.d = ricordati;
      vai(ricordati.serveInformativa ? 'informativa' : 'home');
      caricaStato(true);
    } else {
      caricaStato(false);
    }
  }
  
  var tr = /[#&]trasloco=([A-Za-z0-9_-]+)/.exec(location.hash || '');
  if (tr) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  if (tr && SERVER) {
    vai('carico');
    chiama('completaTrasloco', { trasloco: tr[1], telefono: idTelefono(), apparecchio: apparecchio(), descrizione: descriviTelefono() }).then(function (r) {
      if (r && r.ok) { salvaMem('tm_cod', r.codice); salvaMem('tm_disp', r.dispositivo); togliMem('tm_stato'); }
      else if (r && r.messaggio && !codice()) S.erroreAccesso = r.messaggio;
      avvia();
    }).catch(function () { avvia(); });
  } else {
    avvia();
  }
})();
</script>
</body>
</html>
